[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapdragon"
version = "0.3.0"
description = "From-scratch 500M parameter LLM, optimised to train on a single 12-16GB GPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tokenizers>=0.20",
    "regex>=2023.1",
    "safetensors>=0.4",
]

[project.optional-dependencies]
data = ["datasets>=2.20"]
logging = ["tensorboard>=2.16", "wandb>=0.17"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snapdragon = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PT"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: needs a CUDA device",
    "slow: takes more than a few seconds",
]
addopts = "-ra"
