name: ci
on:
  push:
    branches: [v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,data]" transformers
      - name: lint
        run: ruff check .
      - name: unit tests (CPU)
        run: pytest -q -m "not gpu and not slow"

  slow:
    # end-to-end smoke run and the two-process gloo tests (DDP gradients, FSDP2) that cannot run on Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,data]" transformers
      - name: slow tests
        run: pytest -q -m slow
