name: ci
on:
  push:
    branches: [v3]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,data]"
      - name: lint
        run: ruff check .
      - name: test
        run: pytest -q -m "not gpu and not slow"
